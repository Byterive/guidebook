# Streamlit theme of the look. Put this file at <your app folder>/.streamlit/config.toml and start Streamlit from that folder.
# Light: concrete grey page, light panels, ink text. Dark: the site's dark palette (design-tokens.json, site.dark). Streamlit follows the viewer's setting.
# The dark header, the board and the status colours come from ui_style.css and ui_helpers.py and are the same in both.
[theme]
baseRadius = "small"
font = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap"

[theme.light]
base = "light"
primaryColor = "#18222A"
backgroundColor = "#D9DFDC"
secondaryBackgroundColor = "#EEF2F0"
textColor = "#16232B"
linkColor = "#2F5D7A"
borderColor = "#C9D2CE"

[theme.light.sidebar]
backgroundColor = "#EEF2F0"

[theme.dark]
base = "dark"
primaryColor = "#7DB2FF"
backgroundColor = "#12151C"
secondaryBackgroundColor = "#1A1F29"
textColor = "#E7EAF0"
linkColor = "#7DB2FF"
borderColor = "#2A3141"

[theme.dark.sidebar]
backgroundColor = "#1A1F29"

[client]
toolbarMode = "minimal"      # hides the Deploy button and developer menu
